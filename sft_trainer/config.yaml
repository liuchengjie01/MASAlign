# config.yaml
model:
  path: "E:/luis/GUI-Owl-7B"
  trust_remote_code: true
  torch_dtype: "bfloat16"       # bfloat16 / float16 / float32

data:
  train_jsonl: "./sft_trainer/data"
  max_length: 4096
  max_images: 1                  # Keep only the newest screenshot in each sample
  max_pixels: 802816             # 1024 * 28 * 28, below one million pixels
  system_prompt: ""
  data_type: "gui_owl"

lora:
  enable: false
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  task_type: "CAUSAL_LM"

training:
  output_dir: "./sft_trainer/guiowl_ckpt"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  logging_strategy: "steps"
  logging_steps: 10
  logging_first_step: true
  save_strategy: "epoch"
  save_total_limit: 2
  bf16: true
  fp16: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: true
  report_to: "none"
  fsdp: "auto_wrap"
  fsdp_config:
    fsdp_version: 2
    reshard_after_forward: true
    state_dict_type: "FULL_STATE_DICT"
  remove_unused_columns: false
  dataloader_pin_memory: false
  seed: 42
  resume_from_checkpoint: null   # 路径或 null

runtime:
  num_workers: 0
  debug: false                  # true 时只取前 5 条样本
